# EveryDB2 ETL Table Configuration
# 103 tables: n_ (53 raced/master) + s_ (50 delta)
#
# Fields:
#   db_table:       PostgreSQL table name (required)
#   parquet_key:    Output parquet file name (required)
#   category:       Directory category: raw/odds (required)
#   type:           Table type: raced/master/delta (required)
#   pk:             Primary key columns for delta merge (required)
#   partition_cols: Partition columns for large tables (optional)

tables:
  # ============================================================
  # n_ raced: race-bound data (date-filtered by year+monthday)
  # ============================================================
  - db_table: n_race
    parquet_key: races
    category: raw
    type: raced
    pk: [year, monthday, jyocd, kaiji, nichiji, racenum]

  - db_table: n_uma_race
    parquet_key: entries
    category: raw
    type: raced
    pk: [year, monthday, jyocd, kaiji, nichiji, racenum, umaban, kettonum]

